name: Mikova core behavior tests
on:
  push:
    branches: ["verify/mikova-core"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test production PCM playback and self-host HTTP code
        run: ./src/android/gradlew -p .github/ci/core-tests --no-daemon test -Dorg.gradle.jvmargs='-Xmx1500m -Dfile.encoding=UTF-8'
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: .github/ci/core-tests/build/test-results/
